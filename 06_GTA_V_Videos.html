<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080914"><title>LEONIDA HQ — Videos</title>
<style>
:root{--bg:#080914;--panel:#15172b;--line:#34385d;--cyan:#39d9ff;--pink:#f13dce;--text:#f7f7ff;--muted:#aeb4d1}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}body{padding:10px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 80% 0,#2a1450 0,transparent 38%),var(--bg)}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;text-shadow:0 0 12px var(--cyan)}button,input{font:inherit}.lang,.chip,.search button,.act{border:1px solid #555b83;background:#171b32;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800}.search{display:flex;gap:7px}.search input{min-width:0;flex:1;background:#0c1023;color:#fff;border:1px solid #41496d;border-radius:12px;padding:12px}.search button{background:linear-gradient(100deg,#087dba,#833ec2)}.categories{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.chip{white-space:nowrap;font-size:12px}.chip.active{background:linear-gradient(100deg,#087dba,#833ec2)}.status{min-height:18px;color:var(--muted);font-size:11px;line-height:1.4}.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.card{min-height:100%;height:100%;scroll-snap-align:start;display:flex;flex-direction:column;gap:9px;padding:10px;margin-bottom:7px;border:1px solid #393d67;border-radius:16px;background:linear-gradient(155deg,#251442,#0c1126 65%,#090d1c)}.player{position:relative;width:100%;aspect-ratio:16/9;max-height:44vh;min-height:190px;background:#000;border-radius:12px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.player img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;border:0;border-radius:0;background:#0004;display:grid;place-items:center}.play span{background:#e21c68;border-radius:50%;padding:15px 19px;font-size:25px}.vtitle{font-weight:900;line-height:1.35}.channel,.desc{color:var(--muted);font-size:11px;line-height:1.4}.actions{display:flex;gap:7px;margin-top:auto}.actions>*{flex:1;text-align:center;text-decoration:none}.actions a{border:1px solid #555b83;border-radius:10px;padding:9px;color:#fff}.empty{border:1px solid var(--line);background:var(--panel);padding:16px;border-radius:14px;line-height:1.5}.empty a{color:#7ee3ff}.feed-end{text-align:center;color:var(--muted);padding:12px;font-size:11px}@media(min-width:700px){body{max-width:700px;margin:auto}.player{max-height:48vh}}
.module-icon{width:42px;height:42px;flex:none;object-fit:cover;border-radius:13px;border:1px solid rgba(255,255,255,.2);box-shadow:0 5px 18px #0008}.top{gap:10px}.brand{flex:1;min-width:0}</style></head><body>
<header class="top"><img class="module-icon" src="assets/icons/06_Videos.webp" alt=""><div class="brand">LEONIDA <span style="color:#ffc857">HQ</span> · <span data-ar="فيديوهات" data-en="VIDEOS">VIDEOS</span></div><button id="languageToggle" class="lang" type="button">ع</button></header>
<form class="search" id="searchForm"><input id="query" type="search" data-ph-ar="ابحث عن GTA V أو GTA VI..." data-ph-en="Search GTA V or GTA VI..." placeholder="Search GTA V or GTA VI..." autocomplete="off"><button type="submit" data-ar="بحث" data-en="Search">Search</button></form>
<nav class="categories" id="categories"><button class="chip active" data-cat="all" data-q="GTA V gameplay" data-ar="الكل" data-en="For You">For You</button><button class="chip" data-cat="missions" data-q="GTA V story missions walkthrough" data-ar="المهمات" data-en="Missions">Missions</button><button class="chip" data-cat="secrets" data-q="GTA V secrets easter eggs" data-ar="أسرار" data-en="Secrets">Secrets</button><button class="chip" data-cat="cars" data-q="GTA V best cars customization" data-ar="السيارات" data-en="Cars">Cars</button><button class="chip" data-cat="online" data-q="GTA Online heists" data-ar="الأونلاين" data-en="Online">Online</button><button class="chip" data-cat="comparisons" data-q="GTA V vs GTA VI comparison" data-ar="مقارنات" data-en="Comparisons">Comparisons</button><button class="chip" data-cat="tips" data-q="GTA V tips locations guide" data-ar="نصائح" data-en="Tips">Tips</button><button class="chip" data-cat="mods" data-q="GTA V mods gameplay" data-ar="مودات" data-en="Mods">Mods</button></nav>
<div id="status" class="status" aria-live="polite"></div><main class="feed" id="feed"></main>
<script>
(()=>{'use strict';
const SEARCH_API=''; // Paste your deployed Worker URL inside these quotes.
const KEY='LEONIDA_HQ_LANGUAGE';let lang='en';try{lang=localStorage.getItem(KEY)||'en'}catch(e){}
const $=id=>document.getElementById(id),t=(ar,en)=>lang==='ar'?ar:en,feed=$('feed');let query='GTA V gameplay',next='',busy=false,observer=null,activeCard=null,activeHost=null;
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar][data-en]').forEach(e=>e.textContent=e.getAttribute(lang==='ar'?'data-ar':'data-en'));document.querySelectorAll('[data-ph-ar][data-ph-en]').forEach(e=>e.placeholder=e.getAttribute(lang==='ar'?'data-ph-ar':'data-ph-en'));$('languageToggle').textContent=lang==='ar'?'EN':'ع';}
$('languageToggle').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem(KEY,lang)}catch(e){}try{document.cookie=KEY+'='+lang+';path=/;max-age=31536000;SameSite=Lax'}catch(e){}applyLang();});
function configured(){return /^https:\/\//.test(SEARCH_API)}
function setStatus(msg){$('status').textContent=msg}
function clearPlayer(){if(activeHost){const card=activeHost.closest('.card');const thumb=card?.dataset.thumb||'';activeHost.innerHTML=`<img loading="lazy" alt="" src="${esc(thumb)}"><button class="play" type="button"><span>▶</span></button>`;}activeHost=null;activeCard=null;}
function emptyState(q){feed.innerHTML=`<div class="empty">${t('البحث داخل التطبيق يحتاج ربط خدمة YouTube. يمكنك فتح النتائج مباشرة.','In-app search needs YouTube service setup. You can open results directly.')}<br><br><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">${t('فتح نتائج البحث على YouTube ↗','Open YouTube search results ↗')}</a></div>`;}
function cardHTML(v){const thumb=v.thumbnail||('https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg');return `<article class="card" data-id="${esc(v.id)}" data-thumb="${esc(thumb)}"><div class="player"><img loading="lazy" alt="" src="${esc(thumb)}"><button class="play" type="button"><span>▶</span></button></div><div class="vtitle">${esc(v.title)}</div><div class="channel">${esc(v.channel||'YouTube')}</div><div class="desc">${esc(v.description||'')}</div><div class="actions"><button class="act sound" type="button">${t('تشغيل','Play')}</button><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}">${t('فتح YouTube ↗','Open YouTube ↗')}</a></div></article>`;}
const FEATURED=[
{id:'N-xHcvug3WI',title:'Grand Theft Auto V — Official Gameplay Video',channel:'Rockstar Games',description:'Official GTA V gameplay overview.',cats:['all','missions']},
{id:'vZJSlBiA5kw',title:'GTA 5 — Full Game Walkthrough 100% Completion',channel:'GTA Series Videos',description:'Full story walkthrough, missions and completion guide.',cats:['all','missions','tips']},
{id:'rzFW7ic8OWA',title:'GTA 5 — Secrets, Tips and Tricks',channel:'GtaGam3r',description:'Hidden vehicles, weapons, locations and useful tricks.',cats:['all','secrets','tips','cars']},
{id:'h045fjE3l3A',title:'GTA V (Xbox 360) vs GTA VI (PS5) — Comparison',channel:'PlayGround',description:'Graphics, vehicles, world details and physics comparison.',cats:['all','comparisons']}
];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(items,append=false){if(!append){clearPlayer();feed.innerHTML='';}else{$('feedEnd')?.remove();}if(!items.length&&!append){emptyState(query);return;}feed.insertAdjacentHTML('beforeend',items.map(cardHTML).join(''));const end=document.createElement('div');end.id='feedEnd';end.className='feed-end';end.textContent=t('اسحب للمزيد','Scroll for more');feed.append(end);watchCards();}
function playCard(card,withSound=false){if(activeCard===card&&!withSound)return;clearPlayer();const id=card.dataset.id,host=card.querySelector('.player');if(!host)return;activeCard=card;activeHost=host;const player=document.createElement('iframe');player.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&mute='+(withSound?'0':'1')+'&playsinline=1&rel=0';player.title=card.querySelector('.vtitle')?.textContent||'YouTube video';player.allow='autoplay; encrypted-media; picture-in-picture';player.allowFullscreen=true;host.replaceChildren(player);}
function watchCards(){if(!('IntersectionObserver'in window))return;if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(const en of entries){if(en.target.id==='feedEnd'&&en.isIntersecting)loadMore();else if(en.target.classList.contains('card')&&en.isIntersecting&&en.intersectionRatio>.65)playCard(en.target);}},{root:feed,threshold:[.65]});feed.querySelectorAll('.card').forEach(c=>observer.observe(c));const end=$('feedEnd');if(end)observer.observe(end);}
feed.addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;if(e.target.closest('.play')||e.target.closest('.sound'))playCard(card,true);});
async function search(q,token='',append=false){if(busy)return;query=q;busy=true;setStatus(t('جاري البحث…','Searching…'));if(!configured()){busy=false;draw([],false);setStatus(t('البحث داخل التطبيق يحتاج إعداد خدمة YouTube.','In-app search needs YouTube service setup.'));return;}try{const u=new URL(SEARCH_API.replace(/\/$/, '')+'/search');u.searchParams.set('q',q);u.searchParams.set('maxResults','20');u.searchParams.set('lang',lang);if(token)u.searchParams.set('pageToken',token);const r=await fetch(u.toString());const d=await r.json();if(!r.ok)throw new Error(d.error||'Search failed');const items=(d.items||[]).filter(v=>v.id).map(v=>({id:v.id,title:v.title||'YouTube video',channel:v.channel||'YouTube',description:v.description||'',thumbnail:v.thumbnail||''}));next=d.nextPageToken||'';draw(items,append);setStatus(items.length?t(items.length+' فيديوهات',''+items.length+' videos')+' · YouTube':t('لا توجد نتائج.','No results.'));}catch(err){if(!append)emptyState(q);setStatus(t('تعذر جلب النتائج؛ افحص إعدادات خدمة البحث.','Could not load results; check search service setup.'));}finally{busy=false;}}
async function loadMore(){if(busy||!next||!configured())return;const token=next;next='';search(query,token,true);}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('query').value.trim();if(q.length<2){setStatus(t('اكتب كلمتين على الأقل.','Enter at least two characters.'));return;}document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));search(q);});
$('categories').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));$('query').value='';if(!configured()){const hits=FEATURED.filter(v=>v.cats.includes(b.dataset.cat||'all'));query=b.dataset.q;draw(hits,false);setStatus(hits.length?t(hits.length+' فيديوهات مقترحة',''+hits.length+' featured videos'):t('لنتائج أكثر، افتح بحث YouTube أو اربط خدمة البحث.','For more results, open YouTube search or connect the search service.'));if(!hits.length)emptyState(query);}else search(b.dataset.q);});
applyLang();if(configured())search(query);else{draw(FEATURED,false);setStatus(t('فيديوهات مقترحة · اسحب لأعلى للتالي · البحث الكامل يحتاج إعداد API','Featured videos · swipe up · full search needs API setup'));}
})();
</script></body></html>
